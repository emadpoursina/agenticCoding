# Labeled cases for the loop-back decision spec (docs/systems/jev/loop-back.yaml).
# Status: DRAFT. Synthetic cases written from the critic and tester report formats.
# Labels are PROPOSED by the drafter. A human reviewer must confirm or change each one
# before the set is used as ground truth. Set reviewed_by when done.
#
# Label meanings (match the truth table in loop-back.yaml):
#   plan       a specific criterion or flow is wrong, missing, untestable, or contradictory
#              (includes mixed findings: plan wins)
#   implement  the plan is fine and the code or a test does not match it
#   park       neither applies (a general concern, flakiness, environment), or a person must decide
#
# Fields: id, flow_id, report_type (critic | tester), finding, acceptance_criteria,
# code_excerpt (empty string when none), label, reason. Field names match the spec's state.

reviewed_by: null
