# SSH hardening — install as /etc/ssh/sshd_config.d/00-hardening.conf
#
# The first value wins in sshd_config. Keep this file lexically before provider
# drop-ins such as 50-cloud-init.conf, then verify with:
#
#   sshd -t
#   sshd -T | grep -E '^(permitrootlogin|passwordauthentication|pubkeyauthentication|kbdinteractiveauthentication|maxauthtries)'
#
# Apply without dropping the current session:
#   systemctl reload ssh 2>/dev/null || systemctl restart ssh
#
# Verify a second session as the admin user before closing the current one.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no

MaxAuthTries 3
LoginGraceTime 30

X11Forwarding no
# Enable only when a deploy workflow requires SSH agent forwarding.
AllowAgentForwarding no

# Drop idle sessions after roughly 10 minutes (300s x 2).
ClientAliveInterval 300
ClientAliveCountMax 2

# Uncomment only when every admin uses keys and no MFA/2FA is configured.
# AuthenticationMethods publickey

# Non-socket fallback when changing the SSH port. Prefer the ssh.socket
# drop-in on Ubuntu 22.10+ and keep this commented unless needed.
# Port 2222
