# Conservative host baseline — install as /etc/sysctl.d/99-baseline-hardening.conf
#
# This is not a full CIS profile. It closes common network and memory exposure
# with settings that are safe on a normal VPS. Read before applying:
#   sysctl --system
#
# Remove a line if it conflicts with a declared workload and record why.

# Restrict kernel logs, pointers, and ptrace to privileged users.
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
kernel.yama.ptrace_scope = 1

# Disable magic SysRq. Use the provider console for recovery.
kernel.sysrq = 0

# Prevent unprivileged BPF. Remove this line if rootless containers or
# unprivileged eBPF tooling need it.
kernel.unprivileged_bpf_disabled = 1

# Reverse-path filtering and SYN cookies.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.tcp_syncookies = 1

# Ignore ICMP redirects and source-routed packets.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Log impossible source addresses. This can be noisy on some networks.
net.ipv4.conf.all.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Protect against symlink, hardlink, FIFO, and regular-file races.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Prefer RAM over swap. Harmless when no swap is configured.
vm.swappiness = 10
vm.vfs_cache_pressure = 50
