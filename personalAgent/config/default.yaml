# Operational defaults. Host-specific paths belong in .env / Docker Compose,
# not in application code.

context:
  hermes_instructions: /opt/personal-agent/AGENTS.md
  system: /opt/data/hermes-context/SYSTEM.md
  user: /opt/data/hermes-context/USER.md

projects:
  - id: ich-mag-dich
    name: emadpoursina/ich-mag-dich
    repository: github.com/emadpoursina/ich-mag-dich
    location: /workspaces/ich-mag-dich
    default_branch: master
    # Native Hermes projects.db ids that resolve to this operational id.
    # Read once with: sqlite3 /opt/data/projects.db "select id, slug from projects;"
    kanban_project_ids:
      - p_f1577341

ainative:
  path: /ainative
  read_only: true

workspace:
  root: /workspaces

github:
  auth: ssh
  allow_push: true
  allow_pr: true
  allow_merge: false

execution:
  max_retries: 3
  max_concurrent_tasks: 1
  overlay_dir: /var/lib/hermes-kanban

workflow:
  default: feature-loop

harness:
  adapters:
    - id: pi
      active: true
      runtime_path_env: HERMES_PI_RUNTIME
      # The mounted manifest names the container-visible executable.
  # Provider-neutral default profile; Pi resolves it inside its own runtime.
  model_profile: default
  # Optional per-step model-profile mapping (one key per agent state).
  # Unknown step keys fail closed at startup.
  # step_profiles:
  #   ready: ready
  #   critic: critic
  #   tester: tester
  #   pr-review: pr-review
  # Optional Pi CLI selection. Unlisted profiles leave the model to Pi,
  # except a non-default name, which is passed as --model.
  # models:
  #   DeepSeekFlash:
  #     provider: custom
  #     model: DeepSeekFlash
  timeout_seconds: 1800

# External Spec Kit plan/tasks/implement never look up planner or builder.
# Agent states run as Pi sessions via the harness; see /ainative/docs/systems/feature-loop.md
learning:
  enabled: true
  auto_modify_ainative: false

notifications:
  telegram:
    enabled: true

# Optional per-step model assignments for the OpenAI-compatible executor.
model:
  # Primary: configure provider/model inside Hermes (HERMES_HOME/config.yaml).
  # Optional OpenAI-compatible override via OPENAI_BASE_URL + OPENAI_API_KEY.
  # Role model ids are operator-configured; leave unset until assigned.
  openai_compatible:
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
