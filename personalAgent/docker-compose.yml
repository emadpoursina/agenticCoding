services:
  hermes:
    image: hermes-personal-coding:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-personal-coding
    restart: unless-stopped
    command: gateway run
    ports:
      - "${GATEWAY_PORT:-8642}:8642"
      - "${DASH_PORT:-9119}:9119"
    volumes:
      # All agent state lives under HERMES_DATA_ROOT — never in the user's $HOME.
      # .gitconfig needs no mount: it sits at state/home/.gitconfig, which lands at
      # /opt/data/home/.gitconfig because it is nested inside the state mount.
      - "${HERMES_DATA_ROOT}/state:/opt/data"
      - "${HERMES_DATA_ROOT}/workspace:/opt/data/mnt/workspace"
      # A dedicated key only (~/.ssh is NOT mounted).
      - "${HERMES_DATA_ROOT}/ssh:/opt/data/home/.ssh:ro"
      - "${AINATIVE_HOST_PATH}:/opt/data/mnt/AiNative:ro"
    env_file:
      - .env
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${DASH_USER}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${DASH_PASS}"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${DASH_SECRET}"
      HOME: /opt/data/home
      GIT_SSH_COMMAND: "ssh -F /dev/null -i /opt/data/home/.ssh/git_key -o IdentitiesOnly=yes -o UserKnownHostsFile=/opt/data/home/.ssh/known_hosts -o StrictHostKeyChecking=yes"
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL}"
      GIT_COMMITTER_NAME: "${GIT_COMMITTER_NAME}"
      GIT_COMMITTER_EMAIL: "${GIT_COMMITTER_EMAIL}"
    shm_size: "1g"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
