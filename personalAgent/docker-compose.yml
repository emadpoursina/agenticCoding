services:
  hermes:
    image: hermes-personal-coding:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-personal-coding
    restart: unless-stopped
    command: gateway run
    ports:
      - "${GATEWAY_PORT:-8642}:8642"
      - "${DASH_PORT:-9119}:9119"
    volumes:
      - "${HOME}/.hermes-personal-coding:/opt/data"
      - "${AINATIVE_HOST_PATH}:/opt/data/mnt/AiNative:ro"
      - "${HOME}/hermes-workspace-personal-coding:/opt/data/mnt/workspace"
    env_file:
      - .env
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${DASH_USER}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${DASH_PASS}"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${DASH_SECRET}"
      HOME: /opt/data/home
      GH_TOKEN: "${GH_TOKEN:-${GITHUB_TOKEN}}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-${GH_TOKEN}}"
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL}"
      GIT_COMMITTER_NAME: "${GIT_COMMITTER_NAME}"
      GIT_COMMITTER_EMAIL: "${GIT_COMMITTER_EMAIL}"
      # HTTPS-only GitHub auth via gh credential helper (no ~/.ssh mount).
      # Forces SSH-style remotes onto HTTPS so the token is used.
      GIT_CONFIG_COUNT: "5"
      GIT_CONFIG_KEY_0: "credential.https://github.com.helper"
      GIT_CONFIG_VALUE_0: "!gh auth git-credential"
      GIT_CONFIG_KEY_1: "url.https://github.com/.insteadOf"
      GIT_CONFIG_VALUE_1: "git@github.com:"
      GIT_CONFIG_KEY_2: "url.https://github.com/.insteadOf"
      GIT_CONFIG_VALUE_2: "ssh://git@github.com/"
      GIT_CONFIG_KEY_3: "user.name"
      GIT_CONFIG_VALUE_3: "${GIT_AUTHOR_NAME}"
      GIT_CONFIG_KEY_4: "user.email"
      GIT_CONFIG_VALUE_4: "${GIT_AUTHOR_EMAIL}"
    shm_size: "1g"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
